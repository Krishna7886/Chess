<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chess</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #312e2b;
            color: #fff;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-layout {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            /* Reduced gap for a tighter layout */
            flex-wrap: wrap;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .headLine {
            font-weight: 600;
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .opening-display {
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
            min-height: 30px;
            font-size: 1.4rem;
            font-weight: 400;
            color: #f0d9b5;
            line-height: 1.4;
        }

        .timers {
            display: none;
            justify-content: space-between;
            width: 100%;
            font-size: 1.8rem;
            padding: 5px 0;
            margin-bottom: 10px;
        }

        .timer {
            padding: 5px 15px;
            background-color: #4a4a4a;
            border-radius: 5px;
        }

        .status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            min-height: 40px;
        }

        #turn-display,
        #game-status {
            font-size: 1.5rem;
            font-weight: 400;
            padding: 5px 15px;
            border-radius: 5px;
        }

        #game-status {
            color: #ffc107;
            font-weight: 600;
        }

        .board-and-bar-container {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .board {
            display: flex;
            flex-wrap: wrap;
            width: 90vmin;
            height: 90vmin;
            max-width: 640px;
            max-height: 640px;
            border: 5px solid #4a4a4a;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 12.5%;
            height: 12.5%;
            box-sizing: border-box;
            position: relative;
            transition: background-color 0.2s;
        }

        .square.light {
            background-color: #f0d9b5;
        }

        .square.dark {
            background-color: #b58863;
        }

        .square.selected {
            background-color: rgba(90, 180, 255, 0.7) !important;
        }

        .square.highlight-last-move {
            background-color: rgba(255, 255, 0, 0.4) !important;
        }

        .piece {
            width: 95%;
            height: 95%;
            cursor: pointer;
            user-select: none;
            -webkit-user-drag: none;
            position: relative;
            z-index: 1;
        }

        .highlight-move::after {
            content: '';
            position: absolute;
            width: 35%;
            height: 35%;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            z-index: 0;
        }

        .new-game-btn {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
        }

        /* --- Analysis Bar Styles --- */
        .analysis-bar {
            width: 30px;
            height: 90vmin;
            /* Match board height */
            max-height: 640px;
            /* Match board max-height */
            background-color: #4a4a4a;
            /* Black's advantage color */
            border: 2px solid #666;
            border-radius: 5px;
            display: flex;
            flex-direction: column-reverse;
            /* To have white at the bottom */
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .analysis-bar-white {
            width: 100%;
            height: 50%;
            /* Initial state is 50/50 */
            background-color: #f0d9b5;
            /* White's advantage color */
            transition: height 0.7s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #4a4a4a;
            padding: 30px;
            border-radius: 10px;
            color: white;
            text-align: center;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .modal-content .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .modal-content select,
        .modal-content label,
        .modal-content input {
            font-size: 16px;
        }
    </style>
</head>

<body>
    <!-- Game Setup Modal -->
    <div id="game-setup-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Game Setup</h2>
            <div class="form-group">
                <label for="time-limit">Time Limit:</label><br>
                <select id="time-limit" name="time-limit" style="width:100%; padding: 5px;">
                    <option value="0">No Timer</option>
                    <option value="180">3 Minutes</option>
                    <option value="300">5 Minutes</option>
                    <option value="600" selected>10 Minutes</option>
                    <option value="1200">20 Minutes</option>
                </select>
            </div>
            <div class="form-group">
                <label>Game Mode:</label><br>
                <input type="radio" id="mode-pvc" name="gameMode" value="pvc" checked>
                <label for="mode-pvc">Player vs. Computer</label><br>
                <input type="radio" id="mode-pvp" name="gameMode" value="pvp">
                <label for="mode-pvp">Player vs. Player</label>
            </div>
            <div class="form-group" id="difficulty-group">
                <label for="difficulty">Difficulty:</label><br>
                <select id="difficulty" name="difficulty" style="width:100%; padding: 5px;">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <button id="start-game-btn" class="new-game-btn">Start Game</button>
        </div>
    </div>
    <div class="main-layout">
        <div class="game-container">
            <div class="headLine">Chess</div>
            <div class="opening-display" id="opening-name-display">-</div>
            <div class="timers">
                <div id="black-timer" class="timer">10:00</div>
                <div id="white-timer" class="timer">10:00</div>
            </div>
            <div class="status-bar">
                <div id="turn-display">White's Turn</div>
                <div id="game-status"></div>
                <button class="new-game-btn" onclick="showGameSetup()">New Game</button>
            </div>
            <!-- New container for the board and the analysis bar -->
            <div class="board-and-bar-container">
                <div class="board"></div>
                <div class="analysis-bar">
                    <div class="analysis-bar-white" id="white-advantage-bar"></div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    const boardElement = document.querySelector(".board");
    const turnDisplay = document.getElementById('turn-display');
    const gameStatusDisplay = document.getElementById('game-status');
    const modal = document.getElementById('game-setup-modal');
    const whiteAdvantageBar = document.getElementById('white-advantage-bar');


    // !!! IMPORTANT: Set this to the name of your folder containing the piece images !!!
    const pieces = {
        'P': `PawnW.png`, 'R': `RookW.png`, 'N': `KnightW.png`, 'B': `BishopW.png`, 'Q': `QueenW.png`, 'K': `KingW.png`,
        'p': `PawnB.png`, 'r': `RookB.png`, 'n': `KnightB.png`, 'b': `BishopB.png`, 'q': `QueenB.png`, 'k': `KingB.png`,
    };

    // --- NEW: Sound Effects ---
    // Ensure you have a 'sounds' folder with these files.
   

    const pieceValues = { 'P': 10, 'N': 30, 'B': 30, 'R': 50, 'Q': 90, 'K': 900 };
    const difficultyLevels = { easy: 1, medium: 3, hard: 4 };

    const openingsDB = {
        "1. e4": "King's Pawn Game", "1. e4 e5": "Open Game", "1. e4 e5 2. Nf3": "King's Knight Opening", "1. e4 e5 2. Nf3 Nc6": "Double King's Pawn Game", "1. e4 e5 2. Nf3 Nc6 3. Bc4": "Italian Game", "1. e4 e5 2. Nf3 Nc6 3. Bc4 Bc5": "Giuoco Piano", "1. e4 e5 2. Nf3 Nc6 3. Bc4 Bc5 4. b4": "Evans Gambit", "1. e4 e5 2. Nf3 Nc6 3. Bc4 Nf6": "Two Knights Defense", "1. e4 e5 2. Nf3 Nc6 3. Bb5": "Ruy Lopez", "1. e4 e5 2. Nf3 Nc6 3. d4": "Scotch Game", "1. e4 e5 2. Nf3 Nc6 3. Nc3 Nf6": "Four Knights Game", "1. e4 e5 2. Nf3 Nf6": "Petrov's Defense", "1. e4 e5 2. Nf3 d6": "Philidor's Defense", "1. e4 e5 2. Nc3": "Vienna Game", "1. e4 e5 2. f4": "King's Gambit", "1. e4 c5": "Sicilian Defense", "1. e4 c6": "Caro-Kann Defense", "1. e4 d5": "Scandinavian Defense", "1. e4 d6": "Pirc Defense", "1. e4 e6": "French Defense", "1. e4 g6": "Modern Defense", "1. e4 Nf6": "Alekhine's Defense", "1. e4 Nc6": "Nimzowitsch Defense",
        "1. d4": "Queen's Pawn Game", "1. d4 d5": "Queen's Pawn Game", "1. d4 d5 2. c4": "Queen's Gambit", "1. d4 d5 2. c4 dxc4": "Queen's Gambit Accepted", "1. d4 d5 2. c4 e6": "Queen's Gambit Declined", "1. d4 d5 2. c4 c6": "Slav Defense", "1. d4 d5 2. Nf3 Nf6 3. e3": "Colle System", "1. d4 d5 2. Bf4": "London System", "1. d4 d6 2. Nf3 Bg4": "Wade Defense", "1. d4 f5": "Dutch Defense", "1. d4 Nf6": "Indian Defense", "1. d4 Nf6 2. c4": "Indian Game", "1. d4 Nf6 2. c4 c5": "Benoni Defense", "1. d4 Nf6 2. c4 c5 3. d5 b5": "Benko Gambit", "1. d4 Nf6 2. c4 e5": "Budapest Gambit", "1. d4 Nf6 2. c4 e6": "Indian Game", "1. d4 Nf6 2. c4 e6 3. Nc3 Bb4": "Nimzo-Indian Defense", "1. d4 Nf6 2. c4 e6 3. Nf3": "Indian Game", "1. d4 Nf6 2. c4 e6 3. Nf3 b6": "Queen's Indian Defense", "1. d4 Nf6 2. c4 e6 3. Nf3 Bb4+": "Bogo-Indian Defense", "1. d4 Nf6 2. c4 e6 3. g3": "Catalan Opening", "1. d4 Nf6 2. c4 g6": "King's Indian Defense", "1. d4 Nf6 2. c4 g6 3. Nc3 d5": "Grünfeld Defense", "1. d4 Nf6 2. c4 g6 3. Nc3 Bg7": "King's Indian Defense (Main Line)", "1. d4 Nf6 2. Nf3 e6 3. Bg5": "Torre Attack",
        "1. c4": "English Opening", "1. f4": "Bird's Opening", "1. Nf3": "Réti Opening", "1. Nf3 d5 2. g3": "King's Indian Attack"
    };

    // Game State Variables
    let boardState = [];
    let selectedPieceElement = null;
    let currentPlayer = 'white';
    let whiteKingPos, blackKingPos;
    let isGameOver = false;
    let lastMove = null;
    let gameMode = 'pvc';
    let difficulty = 'medium';
    let timeLimitInSeconds = 600;
    let castlingRights = {};
    let sanHistory = [];
    let currentOpeningName = '';
    let timers = { white: 600, black: 600 };
    let timerIntervals = { white: null, black: null };


    function initializeBoardState() {
        boardState = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'], ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
            [null, null, null, null, null, null, null, null], [null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null], [null, null, null, null, null, null, null, null],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'], ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
        ];
        whiteKingPos = { row: 7, col: 4 };
        blackKingPos = { row: 0, col: 4 };
        currentPlayer = 'white';
        isGameOver = false;
        lastMove = null;
        castlingRights = { w: { k: true, q: true }, b: { k: true, q: true } };
        sanHistory = [];
        currentOpeningName = '';
        gameStatusDisplay.textContent = '';
        document.getElementById('opening-name-display').textContent = '-';
        updateTurnDisplay();
        updateAnalysisBar();
    }

    function renderBoard() {
        boardElement.innerHTML = '';
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                let square = document.createElement("div");
                square.classList.add("square");
                square.classList.add((i + j) % 2 === 0 ? "light" : "dark");
                square.dataset.row = i;
                square.dataset.col = j;
                if (lastMove && ((i === lastMove.start.row && j === lastMove.start.col) || (i === lastMove.end.row && j === lastMove.end.col))) {
                    square.classList.add('highlight-last-move');
                }
                const pieceChar = boardState[i][j];
                if (pieceChar) {
                    const pieceElement = document.createElement('img');
                    pieceElement.src = pieces[pieceChar];
                    pieceElement.classList.add('piece');
                    pieceElement.dataset.row = i;
                    pieceElement.dataset.col = j;
                    square.appendChild(pieceElement);
                }
                boardElement.appendChild(square);
            }
        }
    }

    boardElement.addEventListener('click', (event) => {
        if (isGameOver) return;
        if (gameMode === 'pvc' && currentPlayer === 'black') return;
        const clickedSquare = event.target.closest('.square');
        if (!clickedSquare) return;
        const row = parseInt(clickedSquare.dataset.row);
        const col = parseInt(clickedSquare.dataset.col);
        const clickedPiece = boardState[row][col];
        const clickedPieceColor = getPieceColor(clickedPiece);
        if (selectedPieceElement) {
            const startRow = parseInt(selectedPieceElement.dataset.row);
            const startCol = parseInt(selectedPieceElement.dataset.col);
            if (isLegalMove({ row: startRow, col: startCol }, { row, col }, boardState)) {
                movePiece(startRow, startCol, row, col);
                switchTurns();
            } else {
                deselectPiece();
                if (clickedPiece && clickedPieceColor === currentPlayer) {
                    selectPiece(clickedSquare, row, col);
                }
            }
        } else {
            if (clickedPiece && clickedPieceColor === currentPlayer) {
                selectPiece(clickedSquare, row, col);
            }
        }
    });

    function selectPiece(squareElement, row, col) {
        deselectPiece();
        selectedPieceElement = squareElement;
        selectedPieceElement.classList.add('selected');
        highlightValidMoves(row, col);
    }

    function deselectPiece() {
        document.querySelectorAll('.square.selected').forEach(s => s.classList.remove('selected'));
        selectedPieceElement = null;
        clearHighlights();
    }

    function movePiece(startRow, startCol, endRow, endCol) {
        const piece = boardState[startRow][startCol];
        const color = getPieceColor(piece);
        const capturedPiece = boardState[endRow][endCol];
        const isCastle = piece.toUpperCase() === 'K' && Math.abs(startCol - endCol) === 2;

        lastMove = { start: { row: startRow, col: startCol }, end: { row: endRow, col: endCol }, captured: capturedPiece, piece: piece, isCastle };

        // Play sounds based on move type
        if (isCastle) playSound('castle');
        else if (capturedPiece) playSound('capture');
        else playSound('move');

        // Handle rook movement in castling
        if (isCastle) {
            const rookStartCol = endCol > startCol ? 7 : 0;
            const rookEndCol = endCol > startCol ? 5 : 3;
            boardState[startRow][rookEndCol] = boardState[startRow][rookStartCol];
            boardState[startRow][rookStartCol] = null;
        }

        // Update castling rights
        if (piece.toUpperCase() === 'K') {
            castlingRights[color[0]].k = false;
            castlingRights[color[0]].q = false;
        }
        if (piece.toUpperCase() === 'R') {
            if (startCol === 0 && startRow === (color === 'white' ? 7 : 0)) castlingRights.w.q = false;
            if (startCol === 7 && startRow === (color === 'white' ? 7 : 0)) castlingRights.w.k = false;
            if (startCol === 0 && startRow === (color === 'black' ? 0 : 7)) castlingRights.b.q = false;
            if (startCol === 7 && startRow === (color === 'black' ? 0 : 7)) castlingRights.b.k = false;
        }
        // Update rights if a rook is captured
        if (capturedPiece && capturedPiece.toUpperCase() === 'R') {
            if (endRow === 0) { // Black's home rank
                if (endCol === 0) castlingRights.b.q = false;
                if (endCol === 7) castlingRights.b.k = false;
            }
            if (endRow === 7) { // White's home rank
                if (endCol === 0) castlingRights.w.q = false;
                if (endCol === 7) castlingRights.w.k = false;
            }
        }

        // Update King position tracking
        if (piece.toUpperCase() === 'K') {
            if (color === 'white') whiteKingPos = { row: endRow, col: endCol };
            else blackKingPos = { row: endRow, col: endCol };
        }

        // Pawn promotion
        if (piece === 'P' && endRow === 0) boardState[endRow][endCol] = 'Q';
        else if (piece === 'p' && endRow === 7) boardState[endRow][endCol] = 'q';
        else boardState[endRow][endCol] = piece;

        boardState[startRow][startCol] = null;
        deselectPiece();
        renderBoard();
    }

    function switchTurns() {
        if (timeLimitInSeconds > 0) stopTimer(currentPlayer);
        updateHistoryAndOpening();
        updateAnalysisBar();
        currentPlayer = (currentPlayer === 'white') ? 'black' : 'white';
        if (timeLimitInSeconds > 0) startTimer(currentPlayer);
        updateGameStatus();
        if (!isGameOver) {
            updateTurnDisplay();
            if (gameMode === 'pvc' && currentPlayer === 'black') {
                turnDisplay.textContent = "AI is thinking...";
                setTimeout(makeAIMove, 500);
            }
        }
    }

    function updateGameStatus() {
        const legalMoves = getAllPossibleMoves(currentPlayer, boardState);
        const inCheck = isKingInCheck(currentPlayer, boardState, whiteKingPos, blackKingPos);

        if (legalMoves.length === 0) {
            stopTimers();
            isGameOver = true;
            turnDisplay.textContent = "Game Over";
            playSound('gameEnd');
            if (inCheck) {
                const opponentColor = (currentPlayer === 'white') ? 'Black' : 'White';
                gameStatusDisplay.textContent = `Checkmate! ${opponentColor} wins!`;
                whiteAdvantageBar.style.height = (currentPlayer === 'white') ? '0%' : '100%';
            } else {
                gameStatusDisplay.textContent = "Stalemate! It's a draw.";
                whiteAdvantageBar.style.height = '50%';
            }
        } else if (inCheck) {
            gameStatusDisplay.textContent = "Check!";
            playSound('check');
        } else {
            gameStatusDisplay.textContent = "";
        }
    }

    function updateAnalysisBar() {
        if (isGameOver) return;
        const rawScore = -evaluateBoard(boardState);
        const pawnScore = rawScore / 10;
        const percentage = 100 / (1 + Math.exp(-0.4 * pawnScore));
        whiteAdvantageBar.style.height = `${percentage}%`;
    }

    function showGameSetup() { stopTimers(); modal.style.display = 'flex'; }
    document.getElementById('start-game-btn').addEventListener('click', () => {
        gameMode = document.querySelector('input[name="gameMode"]:checked').value;
        difficulty = document.getElementById('difficulty').value;
        timeLimitInSeconds = parseInt(document.getElementById('time-limit').value, 10);
        modal.style.display = 'none';
        const timersElement = document.querySelector('.timers');
        timersElement.style.display = timeLimitInSeconds > 0 ? 'flex' : 'none';
        startGame();
    });
    document.querySelectorAll('input[name="gameMode"]').forEach(radio => {
        radio.addEventListener('change', (event) => {
            document.getElementById('difficulty-group').style.display = (event.target.value === 'pvc') ? 'block' : 'none';
        });
    });
    function startGame() { initializeBoardState(); renderBoard(); timers = { white: timeLimitInSeconds, black: timeLimitInSeconds }; if (timeLimitInSeconds > 0) { updateTimerDisplay('white'); updateTimerDisplay('black'); startTimer('white'); } }
    function formatTime(s) { return `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`; }
    function updateTimerDisplay(c) { document.getElementById(`${c}-timer`).textContent = formatTime(timers[c]); }
    function startTimer(c) { if (timerIntervals[c]) clearInterval(timerIntervals[c]); timerIntervals[c] = setInterval(() => { timers[c]--; updateTimerDisplay(c); if (timers[c] <= 0) handleTimeForfeit(c); }, 1000); }
    function stopTimer(c) { if (timerIntervals[c]) { clearInterval(timerIntervals[c]); timerIntervals[c] = null; } }
    function stopTimers() { stopTimer('white'); stopTimer('black'); }
    function handleTimeForfeit(loserColor) { stopTimers(); isGameOver = true; const winnerColor = loserColor === 'white' ? 'Black' : 'White'; gameStatusDisplay.textContent = `${winnerColor} wins on time!`; turnDisplay.textContent = "Game Over"; whiteAdvantageBar.style.height = (loserColor === 'white') ? '0%' : '100%'; playSound('gameEnd'); }

    function makeAIMove() { const bestMove = findBestMove(); if (bestMove) { movePiece(bestMove.start.row, bestMove.start.col, bestMove.end.row, bestMove.end.col); } switchTurns(); }
    function findBestMove() { let bestMove = null; let bestValue = -Infinity; const moves = getAllPossibleMoves('black', boardState); moves.sort(() => Math.random() - 0.5); for (const move of moves) { const newBoard = JSON.parse(JSON.stringify(boardState)); const piece = newBoard[move.start.row][move.start.col]; newBoard[move.end.row][move.end.col] = piece; newBoard[move.start.row][move.start.col] = null; let newBKingPos = (piece === 'k') ? move.end : blackKingPos; const boardValue = minimax(newBoard, difficultyLevels[difficulty] - 1, false, -Infinity, Infinity, whiteKingPos, newBKingPos); if (boardValue > bestValue) { bestValue = boardValue; bestMove = move; } } return bestMove; }
    function updateTurnDisplay() { turnDisplay.textContent = `${currentPlayer.charAt(0).toUpperCase() + currentPlayer.slice(1)}'s Turn`; }
    function getPieceColor(p) { if (!p) return null; return (p === p.toLowerCase()) ? 'black' : 'white'; }
    function highlightValidMoves(r, c) { const moves = getAllPossibleMoves(currentPlayer, boardState).filter(m => m.start.row === r && m.start.col === c); moves.forEach(move => { const targetSquare = document.querySelector(`.square[data-row="${move.end.row}"][data-col="${move.end.col}"]`); if (targetSquare) targetSquare.classList.add('highlight-move'); }); }
    function clearHighlights() { document.querySelectorAll('.highlight-move').forEach(sq => sq.classList.remove('highlight-move')); }
    function isLegalMove(start, end, board) { if (!isValidMove(start, end, board)) return false; const tempBoard = JSON.parse(JSON.stringify(board)); const piece = tempBoard[start.row][start.col]; tempBoard[end.row][end.col] = piece; tempBoard[start.row][start.col] = null; const color = getPieceColor(piece); let tempWKingPos = { ...whiteKingPos }; let tempBKingPos = { ...blackKingPos }; if (piece.toUpperCase() === 'K') { if (color === 'white') tempWKingPos = { ...end }; else tempBKingPos = { ...end }; } return !isKingInCheck(color, tempBoard, tempWKingPos, tempBKingPos); }
    function isValidMove(start, end, board) { const piece = board[start.row][start.col]; if (!piece) return false; const target = board[end.row][end.col]; if (target && getPieceColor(piece) === getPieceColor(target)) return false; switch (piece.toUpperCase()) { case 'P': return isValidPawnMove(start, end, board); case 'R': return isValidRookMove(start, end, board); case 'N': return isValidKnightMove(start, end); case 'B': return isValidBishopMove(start, end, board); case 'Q': return isValidQueenMove(start, end, board); case 'K': return isValidKingMove(start, end, board); default: return false; } }
    function isPathClear(start, end, board) { const rStep = Math.sign(end.row - start.row), cStep = Math.sign(end.col - start.col); let r = start.row + rStep, c = start.col + cStep; while (r !== end.row || c !== end.col) { if (board[r][c] !== null) return false; r += rStep; c += cStep; } return true; }
    function isValidPawnMove(start, end, board) { const piece = board[start.row][start.col]; const color = getPieceColor(piece); const dir = color === 'white' ? -1 : 1; if (start.col === end.col && !board[end.row][end.col]) { if (end.row === start.row + dir) return true; if (end.row === start.row + 2 * dir && (color === 'white' ? start.row === 6 : start.row === 1) && !board[start.row + dir][start.col]) return true; } if (Math.abs(start.col - end.col) === 1 && end.row === start.row + dir && board[end.row][end.col]) return true; return false; }
    function isValidRookMove(start, end, board) { return (start.row === end.row || start.col === end.col) && isPathClear(start, end, board); }
    function isValidKnightMove(start, end) { const rDiff = Math.abs(start.row - end.row), cDiff = Math.abs(start.col - end.col); return (rDiff === 2 && cDiff === 1) || (rDiff === 1 && cDiff === 2); }
    function isValidBishopMove(start, end, board) { return Math.abs(start.row - end.row) === Math.abs(start.col - end.col) && isPathClear(start, end, board); }
    function isValidQueenMove(start, end, board) { return isValidRookMove(start, end, board) || isValidBishopMove(start, end, board); }
    function isValidKingMove(start, end, board) { if (Math.abs(start.row - end.row) <= 1 && Math.abs(start.col - end.col) <= 1) return true; if (start.row === end.row && Math.abs(start.col - end.col) === 2) return canCastle(start, end, board); return false; }
    function canCastle(start, end, board) { const color = getPieceColor(board[start.row][start.col]); const rights = color === 'white' ? castlingRights.w : castlingRights.b; const kingSide = end.col > start.col; if (isKingInCheck(color, board, whiteKingPos, blackKingPos)) return false; if (kingSide) { if (!rights.k || board[start.row][5] || board[start.row][6]) return false; if (isSquareAttacked({ row: start.row, col: 5 }, color === 'white' ? 'black' : 'white', board) || isSquareAttacked({ row: start.row, col: 6 }, color === 'white' ? 'black' : 'white', board)) return false; } else { if (!rights.q || board[start.row][1] || board[start.row][2] || board[start.row][3]) return false; if (isSquareAttacked({ row: start.row, col: 2 }, color === 'white' ? 'black' : 'white', board) || isSquareAttacked({ row: start.row, col: 3 }, color === 'white' ? 'black' : 'white', board)) return false; } return true; }
    // --- FIXED: More accurate square attack detection ---
    function isSquareAttacked(pos, attackerColor, board) { for (let r = 0; r < 8; r++) { for (let c = 0; c < 8; c++) { const piece = board[r][c]; if (piece && getPieceColor(piece) === attackerColor) { if (piece.toUpperCase() === 'P') { const dir = attackerColor === 'white' ? -1 : 1; if (pos.row === r + dir && Math.abs(pos.col - c) === 1) return true; } else if (isValidMove({ row: r, col: c }, pos, board)) { return true; } } } } return false; }
    function isKingInCheck(kingColor, board, wKingPos, bKingPos) { const kingPos = kingColor === 'white' ? wKingPos : bKingPos; return isSquareAttacked(kingPos, kingColor === 'white' ? 'black' : 'white', board); }
    function getAllPossibleMoves(color, board) { const moves = []; for (let r = 0; r < 8; r++) { for (let c = 0; c < 8; c++) { if (board[r][c] && getPieceColor(board[r][c]) === color) { for (let tr = 0; tr < 8; tr++) { for (let tc = 0; tc < 8; tc++) { if (isLegalMove({ row: r, col: c }, { row: tr, col: tc }, board)) moves.push({ start: { row: r, col: c }, end: { row: tr, col: tc } }); } } } } } return moves; }
    function evaluateBoard(board) { let total = 0; for (let r = 0; r < 8; r++) { for (let c = 0; c < 8; c++) { const p = board[r][c]; if (p) total += (getPieceColor(p) === 'black' ? pieceValues[p.toUpperCase()] : -pieceValues[p.toUpperCase()]); } } return total; }
    function minimax(board, depth, isMax, a, b, wKPos, bKPos) { if (depth === 0) return evaluateBoard(board); const color = isMax ? 'black' : 'white'; const moves = getAllPossibleMoves(color, board); if (moves.length === 0) return isKingInCheck(color, board, wKPos, bKPos) ? (isMax ? -Infinity : Infinity) : 0; if (isMax) { let maxEval = -Infinity; for (const move of moves) { const newBoard = JSON.parse(JSON.stringify(board)); const p = newBoard[move.start.row][move.start.col]; newBoard[move.end.row][move.end.col] = p; newBoard[move.start.row][move.start.col] = null; const newBKingPos = p === 'k' ? move.end : bKPos; maxEval = Math.max(maxEval, minimax(newBoard, depth - 1, false, a, b, wKPos, newBKingPos)); a = Math.max(a, maxEval); if (b <= a) break; } return maxEval; } else { let minEval = Infinity; for (const move of moves) { const newBoard = JSON.parse(JSON.stringify(board)); const p = newBoard[move.start.row][move.start.col]; newBoard[move.end.row][move.end.col] = p; newBoard[move.start.row][move.start.col] = null; const newWKingPos = p === 'K' ? move.end : wKPos; minEval = Math.min(minEval, minimax(newBoard, depth - 1, true, a, b, newWKingPos, bKPos)); b = Math.min(b, minEval); if (b <= a) break; } return minEval; } }

    function updateHistoryAndOpening() { if (!lastMove) return; const san = moveToSAN(lastMove); sanHistory.push(san); let tempPgn = ''; let finalOpening = ''; for (let i = 0; i < sanHistory.length; i++) { if (i % 2 === 0) tempPgn += (i > 0 ? ' ' : '') + `${Math.floor(i / 2) + 1}. ${sanHistory[i]}`; else tempPgn += ` ${sanHistory[i]}`; if (openingsDB[tempPgn]) finalOpening = openingsDB[tempPgn]; } currentOpeningName = finalOpening; document.getElementById('opening-name-display').textContent = currentOpeningName || '-'; }
    function toAlgebraic(pos) { const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h']; const ranks = ['8', '7', '6', '5', '4', '3', '2', '1']; return files[pos.col] + ranks[pos.row]; }
    function moveToSAN(move) { const pieceType = move.piece.toUpperCase(); if (move.isCastle) return move.end.col > move.start.col ? 'O-O' : 'O-O-O'; let san = pieceType === 'P' ? '' : pieceType; if (move.captured) { if (pieceType === 'P') san += toAlgebraic(move.start)[0]; san += 'x'; } san += toAlgebraic(move.end); if (pieceType === 'P' && (move.end.row === 0 || move.end.row === 7)) san += '=Q'; const tempPlayer = currentPlayer === 'white' ? 'black' : 'white'; const legalMoves = getAllPossibleMoves(tempPlayer, boardState); const inCheck = isKingInCheck(tempPlayer, boardState, whiteKingPos, blackKingPos); if (inCheck) { san += legalMoves.length === 0 ? '#' : '+'; } return san; }

    // Start the game initially
    showGameSetup();
    // --- NEW: Sound Effects ---
        // Ensure you have a 'sounds' folder with these files.
        const sounds = {
            move: new Audio('Sounds/move-self.mp3'),
            capture: new Audio('Sounds/capture.mp3'),
            castle: new Audio('Sounds/castle.mp3'),
            check: new Audio('Sounds/move-check.mp3'),
            checkmate: new Audio('Sounds/checkmate.wav'), // Add checkmate sound
            gameEnd: new Audio('Sounds/game-end.wav')
        };

        function playSound(soundKey) {
            if (sounds[soundKey]) {
                sounds[soundKey].currentTime = 0; // Rewind to start
                sounds[soundKey].play().catch(e => console.log("Sound play failed:", e));
            }
        }

        function movePiece(startRow, startCol, endRow, endCol) {
            const piece = boardState[startRow][startCol];
            const color = getPieceColor(piece);
            const capturedPiece = boardState[endRow][endCol];
            const isCastle = piece.toUpperCase() === 'K' && Math.abs(startCol - endCol) === 2;

            lastMove = { start: { row: startRow, col: startCol }, end: { row: endRow, col: endCol }, captured: capturedPiece, piece: piece, isCastle };

            // Play sounds based on move type
            if (isCastle) playSound('castle');
            else if (capturedPiece) playSound('capture');
            else playSound('move'); // Play move sound

            // Handle rook movement in castling
            if (isCastle) {
                const rookStartCol = endCol > startCol ? 7 : 0;
                const rookEndCol = endCol > startCol ? 5 : 3;
                boardState[startRow][rookEndCol] = boardState[startRow][rookStartCol];
                boardState[startRow][rookStartCol] = null;
            }

            // Update castling rights
            if (piece.toUpperCase() === 'K') {
                castlingRights[color[0]].k = false;
                castlingRights[color[0]].q = false;
            }
            if (piece.toUpperCase() === 'R') {
                if (startCol === 0 && startRow === (color === 'white' ? 7 : 0)) castlingRights.w.q = false;
                if (startCol === 7 && startRow === (color === 'white' ? 7 : 0)) castlingRights.w.k = false;
                if (startCol === 0 && startRow === (color === 'black' ? 0 : 7)) castlingRights.b.q = false;
                if (startCol === 7 && startRow === (color === 'black' ? 0 : 7)) castlingRights.b.k = false;
            }

            // Update King position tracking
            if (piece.toUpperCase() === 'K') {
                if (color === 'white') whiteKingPos = { row: endRow, col: endCol };
                else blackKingPos = { row: endRow, col: endCol };
            }

            // Pawn promotion
            if (piece === 'P' && endRow === 0) boardState[endRow][endCol] = 'Q';
            else if (piece === 'p' && endRow === 7) boardState[endRow][endCol] = 'q';
            else boardState[endRow][endCol] = piece;

            boardState[startRow][startCol] = null;
            deselectPiece();
            renderBoard();
            updateGameStatus(); // Check for check or checkmate after the move
        }

        function updateGameStatus() {
            const legalMoves = getAllPossibleMoves(currentPlayer, boardState);
            const inCheck = isKingInCheck(currentPlayer, boardState, whiteKingPos, blackKingPos);

            if (legalMoves.length === 0) {
                stopTimers();
                isGameOver = true;
                turnDisplay.textContent = "Game Over";
                playSound('gameEnd');
                if (inCheck) {
                    const opponentColor = (currentPlayer === 'white') ? 'Black' : 'White';
                    gameStatusDisplay.textContent = `Checkmate! ${opponentColor} wins!`;
                    whiteAdvantageBar.style.height = (currentPlayer === 'white') ? '0%' : '100%';
                    playSound('checkmate'); // Play checkmate sound
                } else {
                    gameStatusDisplay.textContent = "Stalemate! It's a draw.";
                    whiteAdvantageBar.style.height = '50%';
                }
            } else if (inCheck) {
                gameStatusDisplay.textContent = "Check!";
                playSound('check'); // Play check sound
            } else {
                gameStatusDisplay.textContent = "";
            }
        }
