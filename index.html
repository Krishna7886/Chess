<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <style>
        .headLine {
            text-align: center;
            font-weight: 200;
            font-size: 50px;
        }

        .board {
            display: flex;
            flex-wrap: wrap;
        }

        .my {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
            /* Include padding/border in element's total width/height */
        }

        .my.selected {
            background-color: rgba(255, 255, 0, 0.7) !important;
            /* Yellow highlight for selected piece */
        }

        .my.highlight-move {
            background-color: rgba(62, 254, 62, 0.3) !important;
            /* Green highlight for valid moves */
            border: 0px solid blue;
            /* Make valid moves more visible */
        }

        .my:hover {
            border-radius: 5px;
            /* From your original code */
        }
    </style>
</head>

<body>
    <div class="game">
        <div class="headLine">Chess</div>
        <div id="turn-display" style="text-align: center; font-size: 24px; margin-bottom: 10px;">White's Turn</div>
        <div class="board">
        </div>
    </div>
</body>
<script>
    var board = document.querySelector(".board");
    board.style.height = "640px";
    board.style.width = "640px";
    board.style.border = "1px solid red";
    board.style.display = "flex";
    board.style.flexWrap = "wrap";

    // Define the board state as a 2D array
    let boardState = [];

    // Chess piece Unicode characters
    const pieces = {
        'p': '&#9823;', 'r': '&#9820;', 'n': '&#9822;', 'b': '&#9821;', 'q': '&#9819;', 'k': '&#9818;', // Black
        'P': '&#9817;', 'R': '&#9814;', 'N': '&#9816;', 'B': '&#9815;', 'Q': '&#9813;', 'K': '&#9812;'  // White
    };

    // Game state variables
    let selectedPieceElement = null;
    let selectedPieceRow = -1;
    let selectedPieceCol = -1;
    let currentPlayer = 'white';
    let whiteKingPos = { row: 7, col: 4 }; // Track king positions
    let blackKingPos = { row: 0, col: 4 };

    // Initial board setup
    function initializeBoardState() {
        for (let i = 0; i < 8; i++) {
            boardState[i] = new Array(8).fill(null);
        }

        // Pawns
        for (let j = 0; j < 8; j++) {
            boardState[1][j] = 'p'; // Black pawns
            boardState[6][j] = 'P'; // White pawns
        }

        // Rooks
        boardState[0][0] = 'r'; boardState[0][7] = 'r';
        boardState[7][0] = 'R'; boardState[7][7] = 'R';

        // Knights
        boardState[0][1] = 'n'; boardState[0][6] = 'n';
        boardState[7][1] = 'N'; boardState[7][6] = 'N';

        // Bishops
        boardState[0][2] = 'b'; boardState[0][5] = 'b';
        boardState[7][2] = 'B'; boardState[7][5] = 'B';

        // Queens
        boardState[0][3] = 'q';
        boardState[7][3] = 'Q';

        // Kings
        boardState[0][4] = 'k';
        boardState[7][4] = 'K';
    }

    // Function to render the board based on boardState
    function renderBoard() {
        board.innerHTML = ''; // Clear existing board

        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                let box = document.createElement("div");
                box.classList.add("my");
                box.dataset.row = i;
                box.dataset.col = j;

                box.style.height = "80px";
                box.style.width = "80px";
                box.style.fontSize = "60px";
                box.style.textAlign = "center";
                box.style.display = "flex";
                box.style.justifyContent = "center";
                box.style.alignItems = "center";

                if ((i + j) % 2 == 0) {
                    box.style.backgroundColor = "#fff";
                } else {
                    box.style.backgroundColor = "#7dc242";
                }

                const pieceChar = boardState[i][j];
                if (pieceChar) {
                    box.innerHTML = pieces[pieceChar];
                    if (pieceChar === pieceChar.toLowerCase()) {
                        box.style.color = "black";
                    } else {
                        box.style.color = "white";
                    }
                }

                // Hover effects (from your original code)
                box.addEventListener("mouseenter", () => {
                    box.style.fontSize = "61px";
                    // box.style.borderRadius = "5px"; // Moved to CSS for consistency
                });
                box.addEventListener("mouseleave", () => {
                    box.style.fontSize = "60px";
                    // box.style.borderRadius = "0px"; // Moved to CSS for consistency
                });

                board.appendChild(box);
            }
        }
    }

    // Event listener for clicks on the board
    board.addEventListener('click', (event) => {
        const clickedBox = event.target.closest('.my');
        if (!clickedBox) return;

        const row = parseInt(clickedBox.dataset.row);
        const col = parseInt(clickedBox.dataset.col);
        const clickedPiece = boardState[row][col];
        const clickedPieceColor = getPieceColor(clickedPiece);

        if (selectedPieceElement === null) {
            // No piece is currently selected
            if (clickedPiece && clickedPieceColor === currentPlayer) {
                selectedPieceElement = clickedBox;
                selectedPieceRow = row;
                selectedPieceCol = col;
                selectedPieceElement.classList.add('selected');
                highlightValidMoves(row, col);
            }
        } else {
            // A piece is already selected
            if (row === selectedPieceRow && col === selectedPieceCol) {
                // Clicking on the already selected piece: Deselect it
                deselectPiece();
            } else if (clickedPiece && clickedPieceColor === currentPlayer) {
                // Clicking on another piece of the current player's color: Change selection
                deselectPiece();
                selectedPieceElement = clickedBox;
                selectedPieceRow = row;
                selectedPieceCol = col;
                selectedPieceElement.classList.add('selected');
                highlightValidMoves(row, col);
            } else {
                // Attempt to move the selected piece to the clicked square
                if (isValidMove(selectedPieceRow, selectedPieceCol, row, col)) {
                    movePiece(selectedPieceRow, selectedPieceCol, row, col);
                    // Add check for checkmate/stalemate here later
                    switchTurns();
                    deselectPiece();
                } else {
                    // Invalid move: Deselect the piece (could add an error message here)
                    deselectPiece();
                }
            }
        }
    });

    function deselectPiece() {
        if (selectedPieceElement) {
            selectedPieceElement.classList.remove('selected');
            selectedPieceElement = null;
            selectedPieceRow = -1;
            selectedPieceCol = -1;
            clearHighlights();
        }
    }

    function getPieceColor(pieceChar) {
        if (!pieceChar) return null;
        return (pieceChar === pieceChar.toLowerCase()) ? 'black' : 'white';
    }

    function switchTurns() {
        currentPlayer = (currentPlayer === 'white') ? 'black' : 'white';
        document.getElementById('turn-display').textContent = `${currentPlayer.charAt(0).toUpperCase() + currentPlayer.slice(1)}'s Turn`;
        console.log("Current Turn:", currentPlayer);
    }

    // --- Core Chess Logic Functions ---

    /**
     * Checks if a move is valid according to chess rules.
     * IMPORTANT: This currently only checks the piece's movement pattern and path blocking.
     * It DOES NOT check if the move leaves the king in check. That's handled by isLegalMove.
     */
    function isValidMove(startRow, startCol, endRow, endCol) {
        const pieceToMove = boardState[startRow][startCol];
        if (!pieceToMove) return false;

        const targetPiece = boardState[endRow][endCol];
        const pieceToMoveColor = getPieceColor(pieceToMove);
        const targetPieceColor = getPieceColor(targetPiece);

        // Cannot move to the same square
        if (startRow === endRow && startCol === endCol) {
            return false;
        }

        // Cannot capture your own piece
        if (targetPiece && pieceToMoveColor === targetPieceColor) {
            return false;
        }

        const absRowDiff = Math.abs(endRow - startRow);
        const absColDiff = Math.abs(endCol - startCol);

        // Piece-specific movement validation
        switch (pieceToMove.toUpperCase()) {
            case 'P': return isValidPawnMove(startRow, startCol, endRow, endCol, pieceToMove);
            case 'R': return isValidRookMove(startRow, startCol, endRow, endCol);
            case 'N': return isValidKnightMove(startRow, startCol, endRow, endCol);
            case 'B': return isValidBishopMove(startRow, startCol, endRow, endCol);
            case 'Q': return isValidQueenMove(startRow, startCol, endRow, endCol);
            case 'K': return isValidKingMove(startRow, startCol, endRow, endCol);
            default: return false; // Should not happen
        }
    }

    // --- Individual Piece Movement Logic (More Robust) ---

    function isValidPawnMove(startRow, startCol, endRow, endCol, pawnChar) {
        const color = getPieceColor(pawnChar);
        const direction = (color === 'white') ? -1 : 1; // -1 for white (up), 1 for black (down)

        const rowDiff = endRow - startRow;
        const colDiff = Math.abs(endCol - startCol);

        // 1. One square forward
        if (colDiff === 0 && rowDiff === direction && boardState[endRow][endCol] === null) {
            return true;
        }

        // 2. Two squares forward from starting position
        if (colDiff === 0 && rowDiff === 2 * direction && boardState[endRow][endCol] === null &&
            boardState[startRow + direction][startCol] === null &&
            ((color === 'white' && startRow === 6) || (color === 'black' && startRow === 1))) {
            return true;
        }

        // 3. Diagonal capture
        if (colDiff === 1 && rowDiff === direction && boardState[endRow][endCol] !== null &&
            getPieceColor(boardState[endRow][endCol]) !== color) {
            return true;
        }

        // TODO: Implement En Passant
        // TODO: Implement Promotion

        return false;
    }

    function isValidRookMove(startRow, startCol, endRow, endCol) {
        const absRowDiff = Math.abs(endRow - startRow);
        const absColDiff = Math.abs(endCol - startCol);

        if (absRowDiff === 0 && absColDiff > 0) { // Horizontal
            return isPathClearHorizontal(startRow, startCol, endCol);
        }
        if (absColDiff === 0 && absRowDiff > 0) { // Vertical
            return isPathClearVertical(startCol, startRow, endRow);
        }
        return false;
    }

    function isValidKnightMove(startRow, startCol, endRow, endCol) {
        const absRowDiff = Math.abs(endRow - startRow);
        const absColDiff = Math.abs(endCol - startCol);
        return (absRowDiff === 2 && absColDiff === 1) || (absRowDiff === 1 && absColDiff === 2);
    }

    function isValidBishopMove(startRow, startCol, endRow, endCol) {
        const absRowDiff = Math.abs(endRow - startRow);
        const absColDiff = Math.abs(endCol - startCol);
        if (absRowDiff === absColDiff && absRowDiff > 0) { // Must be diagonal
            return isPathClearDiagonal(startRow, startCol, endRow, endCol);
        }
        return false;
    }

    function isValidQueenMove(startRow, startCol, endRow, endCol) {
        // Queen combines Rook and Bishop moves
        return isValidRookMove(startRow, startCol, endRow, endCol) ||
            isValidBishopMove(startRow, startCol, endRow, endCol);
    }

    function isValidKingMove(startRow, startCol, endRow, endCol) {
        const absRowDiff = Math.abs(endRow - startRow);
        const absColDiff = Math.abs(endCol - startCol);
        // Basic one-square move
        return absRowDiff <= 1 && absColDiff <= 1;
        // TODO: Implement Castling
    }

    // Helper functions to check if path is clear for sliding pieces
    function isPathClearHorizontal(row, startCol, endCol) {
        const step = (endCol > startCol) ? 1 : -1;
        for (let c = startCol + step; c !== endCol; c += step) {
            if (boardState[row][c] !== null) return false;
        }
        return true;
    }

    function isPathClearVertical(col, startRow, endRow) {
        const step = (endRow > startRow) ? 1 : -1;
        for (let r = startRow + step; r !== endRow; r += step) {
            if (boardState[r][col] !== null) return false;
        }
        return true;
    }

    function isPathClearDiagonal(startRow, startCol, endRow, endCol) {
        const rowStep = (endRow > startRow) ? 1 : -1;
        const colStep = (endCol > startCol) ? 1 : -1;
        let r = startRow + rowStep;
        let c = startCol + colStep;
        while (r !== endRow && c !== endCol) {
            if (boardState[r][c] !== null) return false;
            r += rowStep;
            c += colStep;
        }
        return true;
    }

    /**
     * Checks if a move is legal, considering if it leaves your own king in check.
     */
    function isLegalMove(startRow, startCol, endRow, endCol) {
        // First, check if the move follows the piece's movement rules
        if (!isValidMove(startRow, startCol, endRow, endCol)) {
            return false;
        }

        // Simulate the move on a temporary board
        const tempBoard = JSON.parse(JSON.stringify(boardState)); // Deep copy
        const piece = tempBoard[startRow][startCol];
        tempBoard[endRow][endCol] = piece;
        tempBoard[startRow][startCol] = null;

        // Update king position if the king moved
        let tempWhiteKingPos = { ...whiteKingPos };
        let tempBlackKingPos = { ...blackKingPos };

        if (piece.toUpperCase() === 'K') {
            if (getPieceColor(piece) === 'white') {
                tempWhiteKingPos = { row: endRow, col: endCol };
            } else {
                tempBlackKingPos = { row: endRow, col: endCol };
            }
        }

        // Check if the current player's king is in check after the simulated move
        const kingColor = getPieceColor(piece);
        let kingRow, kingCol;
        if (kingColor === 'white') {
            kingRow = tempWhiteKingPos.row;
            kingCol = tempWhiteKingPos.col;
        } else {
            kingRow = tempBlackKingPos.row;
            kingCol = tempBlackKingPos.col;
        }

        // Check if the king is in check on the temporary board
        return !isKingInCheck(kingColor, tempBoard, tempWhiteKingPos, tempBlackKingPos);
    }

    /**
     * Checks if a king of a given color is currently under attack on a given board state.
     */
    function isKingInCheck(kingColor, currentBoard, currentWhiteKingPos, currentBlackKingPos) {
        let kingPos;
        if (kingColor === 'white') {
            kingPos = currentWhiteKingPos;
        } else {
            kingPos = currentBlackKingPos;
        }

        const opponentColor = (kingColor === 'white') ? 'black' : 'white';

        // Iterate through all squares on the board
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = currentBoard[r][c];
                if (piece && getPieceColor(piece) === opponentColor) {
                    // Check if this opponent's piece can attack the king's position
                    // We need a specialized function for attacks, as a piece's attack
                    // is slightly different from a move (e.g., pawn diagonal capture vs. forward move)
                    if (canPieceAttack(r, c, kingPos.row, kingPos.col, currentBoard)) {
                        return true; // King is in check
                    }
                }
            }
        }
        return false; // King is not in check
    }

    /**
     * Checks if a piece at (startRow, startCol) can legally attack (endRow, endCol) on a given board.
     * This is similar to isValidMove but might have subtle differences for pawn attacks.
     */
    function canPieceAttack(startRow, startCol, endRow, endCol, currentBoard) {
        const pieceChar = currentBoard[startRow][startCol];
        if (!pieceChar) return false; // No piece at start

        const color = getPieceColor(pieceChar);
        const opponentColor = (color === 'white') ? 'black' : 'white';

        const absRowDiff = Math.abs(endRow - startRow);
        const absColDiff = Math.abs(endCol - startCol);

        switch (pieceChar.toUpperCase()) {
            case 'P': // Pawn attack is only diagonal
                const direction = (color === 'white') ? -1 : 1;
                return absColDiff === 1 && (endRow - startRow) === direction;
            case 'R':
                return isValidRookMove(startRow, startCol, endRow, endCol, currentBoard); // Rook's move logic is its attack logic
            case 'N':
                return isValidKnightMove(startRow, startCol, endRow, endCol); // Knight's move logic is its attack logic
            case 'B':
                return isValidBishopMove(startRow, startCol, endRow, endCol, currentBoard); // Bishop's move logic is its attack logic
            case 'Q':
                return isValidQueenMove(startRow, startCol, endRow, endCol, currentBoard); // Queen's move logic is its attack logic
            case 'K':
                return absRowDiff <= 1 && absColDiff <= 1; // King can attack adjacent squares
            default: return false;
        }
    }


    function movePiece(startRow, startCol, endRow, endCol) {
        const piece = boardState[startRow][startCol];

        // Update king's position if king moved
        if (piece.toUpperCase() === 'K') {
            if (getPieceColor(piece) === 'white') {
                whiteKingPos = { row: endRow, col: endCol };
            } else {
                blackKingPos = { row: endRow, col: endCol };
            }
        }

        boardState[endRow][endCol] = piece;
        boardState[startRow][startCol] = null;

        renderBoard();
    }

    function highlightValidMoves(row, col) {
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                // IMPORTANT: Use isLegalMove here, not just isValidMove
                if (isLegalMove(row, col, i, j)) {
                    const targetBox = document.querySelector(`.my[data-row="${i}"][data-col="${j}"]`);
                    if (targetBox) {
                        targetBox.classList.add('highlight-move');
                    }
                }
            }
        }
    }

    function clearHighlights() {
        document.querySelectorAll('.my.highlight-move').forEach(box => {
            box.classList.remove('highlight-move');
        });
    }

    // Initial setup
    initializeBoardState();
    renderBoard();

</script>

</html>
