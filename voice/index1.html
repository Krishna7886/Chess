<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chess Dashboard AI</title>
    
    <!-- Chessboard.js CSS Framework -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    
    <style>
        :root {
            --bg-color: #1e222b;
            --panel-color: #282c34;
            --accent-color: #00bcd4;
            --success-color: #2ed573;
            --danger-color: #ff4757;
            --text-color: #ffffff;
            --text-muted: #abb2bf;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--accent-color), var(--success-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 950px;
        }

        @media (min-width: 768px) {
            .dashboard {
                grid-template-columns: 450px 1fr;
            }
        }

        /* Chessboard Container */
        .board-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--panel-color);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        #board {
            width: 100%;
            max-width: 420px;
            border-radius: 4px;
            overflow: hidden;
        }

        /* Control Panel Sidebar */
        .panel {
            background: var(--panel-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .status-widget {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-color);
        }

        .status-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .status-value {
            font-size: 15px;
            font-weight: 600;
        }

        .voice-active {
            border-left-color: var(--success-color);
        }

        /* Action Buttons */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button, select {
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #3a3f4b;
            color: var(--text-color);
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--accent-color);
            color: #1e222b;
            grid-column: span 2;
        }

        .btn-success { background: var(--success-color); color: #1e222b; }
        .btn-danger { background: var(--danger-color); }

        /* Advanced Options / Select Modifiers */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
            padding-right: 30px;
        }

        /* Move History Box */
        .history-container {
            flex-grow: 1;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 120px;
            max-height: 180px;
        }

        .history-log {
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: var(--text-muted);
            flex-grow: 1;
            padding-right: 5px;
        }

        .history-row {
            display: grid;
            grid-template-columns: 40px 1fr 1fr;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .instructions {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 6px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: #4b5263; border-radius: 3px; }
    </style>
</head>
<body>

    <h1>Voice Chess Studio</h1>

    <div class="dashboard">
        <!-- Chess Board Module -->
        <div class="board-container">
            <div id="board"></div>
        </div>

        <!-- System Controls Sidebar Panel -->
        <div class="panel">
            
            <!-- Realtime Telemetry/Status Indicators -->
            <div class="status-widget" id="game-status-widget">
                <div class="status-title">Match State</div>
                <div id="game-status" class="status-value">White to move.</div>
            </div>

            <div class="status-widget" id="voice-status-widget">
                <div class="status-title">Voice Parser State</div>
                <div id="voice-status" class="status-value" style="color: var(--text-muted);">Voice engine offline.</div>
            </div>

            <!-- Dashboard Engine Configurations -->
            <div class="form-group">
                <label for="ai-difficulty">Opponent AI Intellect</label>
                <select id="ai-difficulty">
                    <option value="easy">Easy (Randomizer)</option>
                    <option value="medium" selected>Medium (Tactical Attacker)</option>
                    <option value="hard">Hard (2-Ply Minimax Core)</option>
                </select>
            </div>

            <!-- Interactivity System Triggers -->
            <div class="btn-grid">
                <button id="start-voice" class="btn-primary">Initialize Voice Recognition</button>
                <button id="undo-move">Undo Last Move</button>
                <button id="flip-board">Flip Perspective</button>
                <button id="reset-game" class="btn-danger" style="grid-column: span 2;">Restart Game Instance</button>
            </div>

            <!-- Standard Notation Tracking Log -->
            <div class="history-container">
                <div class="status-title" style="margin-bottom: 5px;">Move Tracking Node</div>
                <div class="history-log" id="history-log">
                    <!-- Dynamic entries land here -->
                </div>
            </div>

            <!-- Interface Operational Cheat Sheet -->
            <div class="instructions">
                <strong>Speech System Manual:</strong><br>
                State coordinates cleanly: <em>"E2 to E4"</em>, <em>"G1 to F3"</em>, or <em>"B7 to B8"</em>.
            </div>
        </div>
    </div>

    <!-- Production External Core Dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        // System Engine State Initializations
        let game = new Chess();
        let board = null;
        let speechEngine = null;

        const boardEl = $('#board');
        const gameStatusEl = document.getElementById('game-status');
        const voiceStatusEl = document.getElementById('voice-status');
        const voiceWidget = document.getElementById('voice-status-widget');
        const historyLogEl = document.getElementById('history-log');
        const aiDifficultySel = document.getElementById('ai-difficulty');

        // Configuration targeting high-availability asset servers
        const boardConfig = {
            draggable: true,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDragStart: handleDragStart,
            onDrop: handlePieceDrop,
            onSnapEnd: handleAnimationSync
        };
        
        board = Chessboard('board', boardConfig);

        // Core Drag Limitations (Enforces turn systems)
        function handleDragStart(source, piece, position, orientation) {
            if (game.game_over()) return false;
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        // Logic processing manual drag behaviors
        function handlePieceDrop(source, target) {
            let moveExecution = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (moveExecution === null) return 'snapback';
            
            commitTurnUpdates();
        }

        function handleAnimationSync() {
            board.position(game.fen());
        }

        // Standardized Post-Turn Management & AI Trigger Pipeline
        function commitTurnUpdates() {
            renderMoveHistory();
            refreshStateIndicators();
            
            if (!game.game_over() && game.turn() === 'b') {
                setTimeout(computeAIEngineMove, 450);
            }
        }

        // --- Advanced Move Notation Render Component ---
        function renderMoveHistory() {
            historyLogEl.innerHTML = '';
            const historyData = game.history({ verbose: true });
            
            let htmlPayload = '';
            for (let i = 0; i < historyData.length; i += 2) {
                const moveIndex = Math.floor(i / 2) + 1;
                const whiteMove = historyData[i] ? historyData[i].san : '';
                const blackMove = historyData[i+1] ? historyData[i+1].san : '';
                
                htmlPayload += `
                    <div class="history-row">
                        <div>${moveIndex}.</div>
                        <div>${whiteMove}</div>
                        <div>${blackMove}</div>
                    </div>`;
            }
            historyLogEl.innerHTML = htmlPayload;
            historyLogEl.scrollTop = historyLogEl.scrollHeight;
        }

        // --- Multi-Tier AI Decision Algorithms ---
        function computeAIEngineMove() {
            if (game.game_over()) return;

            const strategy = aiDifficultySel.value;
            const validMoves = game.moves({ verbose: true });
            let chosenMove = null;

            if (strategy === 'easy' || validMoves.length === 0) {
                // Tier 1: Uniform Random Picker
                chosenMove = validMoves[Math.floor(Math.random() * validMoves.length)];
            } 
            else if (strategy === 'medium') {
                // Tier 2: 1-Ply Immediate Capture Matrix Maxima
                const valueMatrix = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 9000 };
                validMoves.sort((alpha, beta) => {
                    let scoreAlpha = alpha.captured ? valueMatrix[alpha.captured] : 0;
                    let scoreBeta = beta.captured ? valueMatrix[beta.captured] : 0;
                    return scoreBeta - scoreAlpha;
                });
                chosenMove = validMoves[0];
            } 
            else if (strategy === 'hard') {
                // Tier 3: 2-Ply MiniMax Engine Core
                let topScore = -Infinity;
                let candidateMoves = [];
                const weights = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 9000 };

                // Board value evaluator function
                function staticEvaluation() {
                    let runningTotal = 0;
                    game.board().forEach(row => {
                        row.forEach(square => {
                            if (square) {
                                let val = weights[square.type];
                                runningTotal += (square.color === 'b') ? val : -val;
                            }
                        });
                    });
                    return runningTotal;
                }

                validMoves.forEach(m => {
                    game.move(m); // Simulating Level 1
                    if (game.game_over() && game.in_checkmate()) {
                        topScore = Infinity;
                        candidateMoves = [m];
                        game.undo();
                        return;
                    }

                    // Level 2 response loop exploration
                    let counterMoves = game.moves();
                    let worstCasePlayerResponse = Infinity;

                    if (counterMoves.length === 0) {
                        worstCasePlayerResponse = staticEvaluation();
                    } else {
                        counterMoves.forEach(cm => {
                            game.move(cm);
                            let score = staticEvaluation();
                            if (score < worstCasePlayerResponse) worstCasePlayerResponse = score;
                            game.undo();
                        });
                    }

                    game.undo();

                    if (worstCasePlayerResponse > topScore) {
                        topScore = worstCasePlayerResponse;
                        candidateMoves = [m];
                    } else if (worstCasePlayerResponse === topScore) {
                        candidateMoves.push(m);
                    }
                });

                chosenMove = candidateMoves[Math.floor(Math.random() * candidateMoves.length)] || validMoves[0];
            }

            game.move(chosenMove);
            board.position(game.fen());
            renderMoveHistory();
            refreshStateIndicators();
        }

        function refreshStateIndicators() {
            let infoText = '';
            let colorAccent = (game.turn() === 'w') ? 'White' : 'Black';

            if (game.in_checkmate()) {
                infoText = `Checkmate! ${colorAccent === 'White' ? 'AI wins the match.' : 'You win!'}`;
            } else if (game.in_draw()) {
                infoText = 'Match Terminated. Position evaluated to a Draw.';
            } else {
                infoText = (game.turn() === 'w') ? "Your turn (White)." : "AI is running processing nodes...";
                if (game.in_check()) infoText += ` [${colorAccent} under Check]`;
            }
            gameStatusEl.textContent = infoText;
        }

        // --- System Functional Buttons Controls ---
        document.getElementById('reset-game').addEventListener('click', () => {
            game.reset();
            board.start();
            renderMoveHistory();
            refreshStateIndicators();
            voiceStatusEl.textContent = "Engine Reset. Voice baseline ready.";
        });

        document.getElementById('undo-move').addEventListener('click', () => {
            // Rollback human player move + AI response move node
            game.undo();
            game.undo();
            board.position(game.fen());
            renderMoveHistory();
            refreshStateIndicators();
            voiceStatusEl.textContent = "Rolled back terminal turn states.";
        });

        document.getElementById('flip-board').addEventListener('click', () => {
            board.flip();
        });

        // --- Speech Recognition System Framework ---
        const SpeechRecognitionNative = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognitionNative) {
            voiceStatusEl.textContent = "Speech framework locked on browser hardware profile.";
            document.getElementById('start-voice').disabled = true;
        } else {
            speechEngine = new SpeechRecognitionNative();
            speechEngine.continuous = true;
            speechEngine.interimResults = false;
            speechEngine.lang = 'en-US';

            document.getElementById('start-voice').addEventListener('click', function() {
                speechEngine.start();
                this.disabled = true;
                this.textContent = "Voice Module Online";
                voiceWidget.classList.add('voice-active');
                voiceStatusEl.textContent = "Awaiting coordinate statements...";
            });

            speechEngine.onresult = function(streamEvent) {
                if (game.turn() === 'b') return; // Disregard inputs while AI executes calculations

                const activeIdx = streamEvent.resultIndex;
                const naturalLanguageInput = streamEvent.results[activeIdx][0].transcript.trim().toLowerCase();
                voiceStatusEl.textContent = `Heard: "${naturalLanguageInput}"`;
                
                interpretVoiceMatrix(naturalLanguageInput);
            };

            speechEngine.onerror = function() { ResetSpeechButtonUI(); };
            speechEngine.onend = function() { ResetSpeechButtonUI(); };
        }

        function ResetSpeechButtonUI() {
            const btn = document.getElementById('start-voice');
            btn.disabled = false;
            btn.textContent = "Initialize Voice Recognition";
            voiceWidget.classList.remove('voice-active');
            voiceStatusEl.textContent = "Voice framework connection closed.";
        }

        function interpretVoiceMatrix(audioString) {
            // Strip out spacing artifacts or conversational words
            let structuredString = audioString.replace(/\s+/g, '').replace(/to/g, '');
            
            // RegEx capturing specific grid coordinate changes (e.g., e2e4)
            const structuralRegEx = /([a-h][1-8])([a-h][1-8])/;
            const parseMatch = structuredString.match(structuralRegEx);

            if (parseMatch) {
                const originCoord = parseMatch[1];
                const destinationCoord = parseMatch[2];

                let attemptedMove = game.move({
                    from: originCoord,
                    to: destinationCoord,
                    promotion: 'q'
                });

                if (attemptedMove === null) {
                    voiceStatusEl.textContent = `Rejected rule violations: ${originCoord.toUpperCase()} ➔ ${destinationCoord.toUpperCase()}`;
                } else {
                    board.position(game.fen());
                    voiceStatusEl.textContent = `Executed: ${originCoord.toUpperCase()} to ${destinationCoord.toUpperCase()}`;
                    commitTurnUpdates();
                }
            } else {
                voiceStatusEl.textContent = `Unparseable phrase: "${audioString}". Use format: "E2 to E4"`;
            }
        }
    </script>
</body>
</html>
